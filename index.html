<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Baby log</title>
<meta name="theme-color" content="#1A1A1A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Baby log">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<a class="skip" href="#main">Skip to the log</a>

<header class="bar">
  <div class="bar-title">
    <p class="bar-eyebrow">Feeds &middot; Diapers</p>
    <h1 id="babyName">Baby log</h1>
  </div>
  <button type="button" class="sync" id="syncBtn">
    <span class="sync-dot" aria-hidden="true"></span><span id="syncText">This phone only</span>
  </button>
  <button type="button" class="icon-btn" id="gearBtn" aria-label="Settings">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7"/></svg>
  </button>
</header>

<main id="main">
  <section class="since" aria-label="Time since the last feed, pee and poop">
    <div class="since-item" data-kind="feed">
      <h2 class="eyebrow">Last feed</h2>
      <p class="since-value" id="sinceFeed">&ndash;</p>
      <p class="since-sub" id="sinceFeedSub">None yet</p>
    </div>
    <div class="since-item" data-kind="pee">
      <h2 class="eyebrow">Last pee</h2>
      <p class="since-value" id="sincePee">&ndash;</p>
      <p class="since-sub" id="sincePeeSub">None yet</p>
    </div>
    <div class="since-item" data-kind="poop">
      <h2 class="eyebrow">Last poop</h2>
      <p class="since-value" id="sincePoop">&ndash;</p>
      <p class="since-sub" id="sincePoopSub">None yet</p>
    </div>
  </section>

  <p class="tally"><span class="eyebrow">Last 24 hours</span> <span id="tally">0 feeds &middot; 0 pees &middot; 0 poops</span></p>

  <p class="notice" id="notice" hidden></p>

  <section class="history" aria-labelledby="historyHead">
    <h2 class="eyebrow" id="historyHead">History</h2>
    <div id="log"></div>
  </section>
</main>

<!-- Appears for a few seconds after a tap: undo, back-date, or add detail. Nothing here is required. -->
<aside class="tray" id="tray" hidden aria-live="polite">
  <div class="tray-head">
    <p class="tray-title" id="trayTitle"></p>
    <button type="button" class="link-btn" id="trayUndo">Undo</button>
  </div>
  <p class="eyebrow tray-label">Happened earlier? Tap how long ago</p>
  <div class="chips" id="trayWhen" role="group" aria-label="How long ago did it happen">
    <button type="button" class="chip" data-back="0" aria-pressed="true">Just now</button>
    <button type="button" class="chip" data-back="15" aria-pressed="false">15 min</button>
    <button type="button" class="chip" data-back="30" aria-pressed="false">30 min</button>
    <button type="button" class="chip" data-back="60" aria-pressed="false">1 hour</button>
  </div>
  <div class="chips" id="traySide" role="group" aria-label="Which side or bottle" hidden>
    <button type="button" class="chip" data-side="L" aria-pressed="false">Left</button>
    <button type="button" class="chip" data-side="R" aria-pressed="false">Right</button>
    <button type="button" class="chip" data-side="B" aria-pressed="false">Both</button>
    <button type="button" class="chip" data-side="bottle" aria-pressed="false">Bottle</button>
  </div>
  <div class="tray-foot">
    <button type="button" class="link-btn" id="trayMore">Add a note or exact time</button>
    <button type="button" class="link-btn" id="trayDone">Done</button>
  </div>
</aside>

<nav class="actions" aria-label="Log it now, one tap">
  <button type="button" class="act" data-log="feed">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 2.5h5M10 2.5v2.2M14 2.5v2.2M8.5 7.5c0-1.6 1.2-2.8 3.5-2.8s3.5 1.2 3.5 2.8v1.4c1 .5 1.5 1.3 1.5 2.4V19a2.5 2.5 0 0 1-2.5 2.5h-5A2.5 2.5 0 0 1 7 19v-7.7c0-1.1.5-1.9 1.5-2.4z"/><path d="M7 13h3M7 16.5h3"/></svg>
    <span class="act-label">Feed</span>
  </button>
  <button type="button" class="act" data-log="pee">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.8c3.4 4.2 6 7.6 6 11.1a6 6 0 0 1-12 0c0-3.500 2.600-6.900 6-11.100z"/><path d="M9.300 14.500a2.800 2.800 0 0 0 2.300 2.700"/></svg>
    <span class="act-label">Pee</span>
  </button>
  <button type="button" class="act" data-log="poop">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11.5 3c.3 1.600-.4 2.700-1.700 3.500-1.200.7-1.800 1.600-1.600 2.900"/><path d="M8.200 9.400h7a2.500 2.500 0 0 1 .600 4.900"/><path d="M8.200 9.400a2.500 2.500 0 0 0-.900 4.800"/><path d="M6.500 14.200h11a3.200 3.200 0 0 1 0 6.400h-11a3.200 3.200 0 0 1 0-6.400z"/></svg>
    <span class="act-label">Poop</span>
  </button>
</nav>

<dialog class="sheet" id="editSheet" aria-labelledby="editTitle">
  <form method="dialog" id="editForm" novalidate>
    <h2 class="sheet-title" id="editTitle" tabindex="-1" autofocus>Edit entry</h2>

    <fieldset class="seg">
      <legend class="eyebrow">What was it</legend>
      <label><input type="radio" name="kind" value="feed"><span>Feed</span></label>
      <label><input type="radio" name="kind" value="pee"><span>Pee</span></label>
      <label><input type="radio" name="kind" value="poop"><span>Poop</span></label>
    </fieldset>

    <label class="field">
      <span class="eyebrow">When</span>
      <input type="datetime-local" id="editWhen" required>
      <span class="field-error" id="editWhenError" hidden>Pick a date and time for this entry.</span>
    </label>

    <div id="feedFields">
      <fieldset class="seg seg-4">
        <legend class="eyebrow">Side or bottle (optional)</legend>
        <label><input type="checkbox" name="side" value="L"><span>Left</span></label>
        <label><input type="checkbox" name="side" value="R"><span>Right</span></label>
        <label><input type="checkbox" name="side" value="B"><span>Both</span></label>
        <label><input type="checkbox" name="side" value="bottle"><span>Bottle</span></label>
      </fieldset>
      <div class="field-row">
        <label class="field">
          <span class="eyebrow">Minutes (optional)</span>
          <input type="number" id="editMin" inputmode="numeric" min="0" max="600" step="1">
        </label>
        <label class="field">
          <span class="eyebrow">Ounces (optional)</span>
          <input type="number" id="editOz" inputmode="decimal" min="0" max="99" step="0.25">
        </label>
      </div>
    </div>

    <label class="field">
      <span class="eyebrow">Note (optional)</span>
      <input type="text" id="editNote" maxlength="280" autocomplete="off">
    </label>

    <div class="sheet-actions">
      <button type="submit" class="btn btn-primary" id="editSave">Save entry</button>
      <button type="button" class="btn" id="editCancel">Cancel</button>
    </div>
    <button type="button" class="btn btn-danger" id="editDelete">Delete this entry</button>
  </form>
</dialog>

<dialog class="sheet" id="settingsSheet" aria-labelledby="settingsTitle">
  <form method="dialog" id="settingsForm" novalidate>
    <h2 class="sheet-title" id="settingsTitle" tabindex="-1" autofocus>Settings</h2>

    <label class="field">
      <span class="eyebrow">Baby's name</span>
      <input type="text" id="setBaby" maxlength="40" autocomplete="off">
    </label>
    <label class="field">
      <span class="eyebrow">Your name on this phone</span>
      <input type="text" id="setMe" maxlength="40" autocomplete="off" placeholder="Dad, Mom, Grandma">
      <span class="field-help">Shown next to what you log, so you can tell who logged what.</span>
    </label>

    <h3 class="eyebrow sheet-sub">Sharing between phones</h3>
    <p class="sheet-status" id="setStatus"></p>
    <label class="field">
      <span class="eyebrow">Sync key</span>
      <input type="password" id="setToken" autocomplete="off" autocapitalize="off" spellcheck="false">
      <span class="field-help">A GitHub key that can read and write the private log only. Paste it once here, then send the other phone a link.</span>
      <span class="field-error" id="setTokenError" hidden></span>
    </label>
    <label class="field">
      <span class="eyebrow">Private log location</span>
      <input type="text" id="setRepo" autocomplete="off" autocapitalize="off" spellcheck="false">
    </label>

    <div class="sheet-actions">
      <button type="submit" class="btn btn-primary" id="setSave">Save settings</button>
      <button type="button" class="btn" id="setCancel">Cancel</button>
    </div>
    <button type="button" class="btn" id="setShare" hidden>Send setup link to the other phone</button>
    <button type="button" class="btn" id="setExport">Download the log as a spreadsheet</button>
  </form>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite" hidden>
  <span id="toastText"></span>
  <button type="button" class="link-btn" id="toastAction" hidden></button>
</div>

<noscript><p class="notice">This log needs JavaScript turned on.</p></noscript>
<script type="module" src="app.js"></script>
</body>
</html>
