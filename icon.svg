<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Home Screen icon. Full-bleed square (iOS rounds the corners itself); the face sits inside the
       middle 80% so Android's round mask never clips it. Same drawing family as the app's cartoons. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD0E0"/><stop offset="1" stop-color="#E6D4FF"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- scattered petals -->
  <g fill="#FFFFFF" opacity=".55">
    <g transform="translate(74 86) scale(.9)"><circle cx="0" cy="-22" r="15"/><circle cx="21" cy="-7" r="15"/><circle cx="13" cy="18" r="15"/><circle cx="-13" cy="18" r="15"/><circle cx="-21" cy="-7" r="15"/></g>
    <g transform="translate(442 436) scale(1.1)"><circle cx="0" cy="-22" r="15"/><circle cx="21" cy="-7" r="15"/><circle cx="13" cy="18" r="15"/><circle cx="-13" cy="18" r="15"/><circle cx="-21" cy="-7" r="15"/></g>
    <g transform="translate(70 440) scale(.6)"><circle cx="0" cy="-22" r="15"/><circle cx="21" cy="-7" r="15"/><circle cx="13" cy="18" r="15"/><circle cx="-13" cy="18" r="15"/><circle cx="-21" cy="-7" r="15"/></g>
  </g>
  <!-- curl of hair -->
  <path d="M246 150c-10-40 20-66 48-54 24 10 20 44-6 44-14 0-20-12-14-22" fill="none" stroke="#B9826A" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- ears -->
  <circle cx="126" cy="286" r="30" fill="#FFD9C7"/>
  <circle cx="386" cy="286" r="30" fill="#FFD9C7"/>
  <circle cx="126" cy="286" r="13" fill="#F6BFA8"/>
  <circle cx="386" cy="286" r="13" fill="#F6BFA8"/>
  <!-- head -->
  <circle cx="256" cy="278" r="134" fill="#FFE8DC"/>
  <path d="M122 278a134 134 0 0 0 268 0c0 60-60 112-134 112s-134-52-134-112z" fill="#FFD9C7" opacity=".5"/>
  <!-- cheeks -->
  <circle cx="178" cy="318" r="25" fill="#F7A8C4" opacity=".8"/>
  <circle cx="334" cy="318" r="25" fill="#F7A8C4" opacity=".8"/>
  <!-- sleeping eyes -->
  <path d="M188 268q24 22 48 0" fill="none" stroke="#6B3A55" stroke-width="12" stroke-linecap="round"/>
  <path d="M276 268q24 22 48 0" fill="none" stroke="#6B3A55" stroke-width="12" stroke-linecap="round"/>
  <!-- small smile -->
  <path d="M236 326q20 18 40 0" fill="none" stroke="#6B3A55" stroke-width="11" stroke-linecap="round"/>
  <!-- flower in her hair -->
  <g transform="translate(352 178)">
    <g fill="#F2709F"><circle cx="0" cy="-30" r="21"/><circle cx="29" cy="-9" r="21"/><circle cx="18" cy="24" r="21"/><circle cx="-18" cy="24" r="21"/><circle cx="-29" cy="-9" r="21"/></g>
    <circle cx="0" cy="0" r="17" fill="#FFD86B"/>
  </g>
</svg>
