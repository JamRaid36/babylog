<!doctype html>
<meta charset="utf-8">
<title>Jubilee: tap-through check</title>
<!-- Drives the real app in a frame and prints PASS/FAIL lines. Serve the repo folder, then:
     chrome --headless=new --virtual-time-budget=20000 --dump-dom http://127.0.0.1:8765/tests/ui-check.html
     Uses the test origin's own storage only; it clears it before and after. -->
<pre id="out">RUNNING</pre>
<iframe id="app" style="width:390px;height:844px;border:1px solid #999"></iframe>
<script>
const lines = [];
let failed = 0;
const check = (name, ok, extra = '') => { if (!ok) failed += 1; lines.push(`${ok ? 'PASS' : 'FAIL'} ${name}${extra ? ` (${extra})` : ''}`); };
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const frame = document.getElementById('app');
const load = (url) => new Promise((r) => { frame.onload = () => setTimeout(r, 300); frame.src = url; });

(async () => {
  try {
    localStorage.clear();

    // ── with sample data ──
    await load('../index.html?demo');
    let d = frame.contentDocument;
    const q = (s) => d.querySelector(s);
    const rows = () => d.querySelectorAll('#log .row').length;
    const before = rows();
    let folded = 0;
    for (const f of d.querySelectorAll('.fold')) { f.click(); folded += d.querySelectorAll('#dayRows .row').length; q('#dayClose').click(); }
    check('today is listed in full, earlier days fold into one line each, and nothing is missing', d.querySelectorAll('.fold').length >= 1 && before + folded === 13 && !q('#daySheet').open, `today=${before} folded=${folded}`);

    q('.act[data-log="pee"]').click();
    check('a tap alone logs nothing', rows() === before && q('#sincePee').textContent !== 'just now');
    check('the tray opens, names it and says it is not saved', !q('#tray').hidden && q('#trayTitle').textContent.startsWith('Pee · ') && q('.tray-unsaved').textContent.includes('Not saved yet') && q('#traySave').textContent === 'Save pee');
    check('side choices stay hidden for a pee', q('#traySide').hidden);
    q('#trayWhen .chip[data-back="15"]').click();
    check('"15 min" before Save still logs nothing', rows() === before);
    q('#traySave').click();
    check('Save adds the entry and closes the tray', rows() === before + 1 && q('#tray').hidden);
    check('"15 min" moved it back', q('#sincePee').textContent === '15m', q('#sincePee').textContent);
    check('the button confirms', q('.act[data-log="pee"] .act-label').textContent === 'Saved');
    check('Save says so, with Undo', q('#toastText').textContent.startsWith('Pee saved') && !q('#toastAction').hidden && q('#toastAction').textContent === 'Undo', q('#toastText').textContent);
    q('#toastAction').click();
    check('Undo removes it', rows() === before);

    q('.act[data-log="pee"]').click();
    q('#trayDiscard').click();
    check('Discard logs nothing and closes the tray', rows() === before && q('#tray').hidden && !q('.waiting'));
    check('Discard says so', q('#toastText').textContent === 'Pee not saved.');

    q('.act[data-log="poop"]').click();
    q('#trayDone').click();
    check('"Not now" keeps it waiting on the front page, still not logged', q('#tray').hidden && rows() === before && d.querySelectorAll('.waiting').length === 1 && q('.waiting-text strong').textContent.startsWith('Save this poop from '), q('.waiting-text')?.textContent);
    q('.act[data-log="pee"]').click();
    check('a second tap does not replace the one waiting', d.querySelectorAll('.waiting').length === 1 && q('#trayTitle').textContent.startsWith('Pee · '));
    q('#trayDiscard').click();
    q('.waiting [data-waiting="open"]').click();
    check('"Add details first" opens it again', !q('#tray').hidden && !q('.waiting') && q('#trayTitle').textContent.startsWith('Poop · '));
    q('#trayDone').click();
    q('.waiting [data-waiting="discard"]').click();
    check('"No, discard" throws it away', !q('.waiting') && rows() === before);
    q('#toastAction').click();
    check('and it can be brought back', d.querySelectorAll('.waiting').length === 1 && rows() === before);
    q('.waiting [data-waiting="save"]').click();
    check('Save on the waiting card logs it', rows() === before + 1 && !q('.waiting') && q('#sincePoop').textContent === 'just now');
    q('#toastAction').click();

    q('.act[data-log="feed"]').click();
    check('side choices show for a feed', !q('#traySide').hidden);
    q('#traySide .chip[data-side="L"]').click();
    check('one tap sets the side', q('#trayWhat').textContent === 'Started left');
    check('the side buttons are Left, Right, Bottle', [...d.querySelectorAll('#traySide .chip')].map((c) => c.textContent).join() === 'Left,Right,Bottle');
    q('#traySide .chip[data-side="R"]').click();
    check('tapping the other side switches it', q('#trayWhat').textContent === 'Started right');
    q('#traySide .chip[data-side="L"]').click();
    q('#traySave').click();
    check('Save closes the tray and logs the feed', q('#tray').hidden && rows() === before + 1 && d.querySelector('.row .row-detail')?.textContent === 'Started left');
    check('"last feed" shows the side', q('#sinceFeedSub').textContent.endsWith('Left'));
    check('front page says which side is next', !q('#nextSide').hidden && q('#nextSide').textContent.includes('Next: start on the right.'), q('#nextSide').textContent);

    d.querySelector('.row').click();
    check('tapping an entry opens the editor', q('#editSheet').open);
    check('editor shows the saved side', d.querySelector('input[name="side"][value="L"]').checked);
    q('#editNote').value = 'sleepy <b>feed</b>';
    q('#editMin').value = '12';
    q('#editForm').requestSubmit();
    const det = d.querySelector('.row .row-detail');
    check('note and minutes are saved', det.textContent === 'Started left · 12 min · sleepy <b>feed</b>', det.textContent);
    check('a note cannot inject markup', det.querySelector('b') === null);
    check('editor closes after saving', !q('#editSheet').open);

    d.querySelector('.row').click();
    d.querySelector('input[name="kind"][value="poop"]').click();
    check('feed-only fields hide for a poop', q('#feedFields').hidden);
    q('#editCancel').click();
    check('Cancel changes nothing', d.querySelector('.row .row-kind').textContent === 'Feed');

    d.querySelector('.row').click();
    q('#editDelete').click();
    check('first Delete tap only arms it', rows() === before + 1 && q('#editDelete').textContent === 'Tap again to delete it');
    q('#editDelete').click();
    check('second tap deletes', rows() === before);
    check('delete offers Undo', !q('#toastAction').hidden && q('#toastAction').textContent === 'Undo');
    q('#toastAction').click();
    check('Undo brings it back', rows() === before + 1);

    // ── Home Screen steps ──
    check('Home Screen steps start folded shut', q('#install') && !q('#install').open);
    q('#install summary').click();
    check('a tap opens them', q('#install').open);
    const steps = [...d.querySelectorAll('#installSteps li')].map((li) => li.textContent);
    const appUrl = frame.contentWindow.location.origin + frame.contentWindow.location.pathname.replace(/index\.html$/, '');
    check('four steps, the first with this app\'s own link', steps.length === 4 && steps[0].endsWith(appUrl), steps[0]);
    q('#installCopy').click();
    await wait(1800);
    check('Copy answers either way', /^(Steps copied|Could not copy)/.test(q('#toastText').textContent), q('#toastText').textContent);
    q('#install summary').click();
    check('a second tap folds them shut', !q('#install').open);

    q('#gearBtn').click();
    check('settings open', q('#settingsSheet').open);
    q('#setRepo').value = 'not a repo';
    q('#settingsForm').requestSubmit();
    check('a bad log location is refused with a reason', q('#settingsSheet').open && !q('#setTokenError').hidden);
    q('#setRepo').value = 'JamRaid36/babylog-data';
    q('#setToken').value = 'https://example.test/app/#s=!!!';
    q('#settingsForm').requestSubmit();
    check('an unreadable setup link is refused with a reason', q('#settingsSheet').open && q('#setTokenError').textContent.includes('fresh one'));
    q('#setCancel').click();

    // ── real mode: does a tap survive closing the app? ──
    await load('../index.html');
    d = frame.contentDocument;
    check('the note from Dad to Mom is the first thing on the front page, word for word', d.querySelector('main').firstElementChild.id === 'cheer' && d.querySelector('#cheer').textContent.replace(/\s+/g, ' ').trim() === "This girl is strong and so are you and don't you forget it!" && d.querySelector('#cheer').getBoundingClientRect().height > 80, d.querySelector('#cheer')?.textContent);
    check('first open is empty with a hint', d.querySelector('.empty-title')?.textContent === 'Nothing logged yet');
    check('first open asks whose phone this is', d.querySelector('#guide').open && !d.querySelector('.guide-step[data-step="who"]').hidden);
    check('only one guide screen shows at a time', d.querySelectorAll('.guide-step:not([hidden])').length === 1);
    d.querySelector('#guide [data-who="mom"]').click();
    check('one tap on Mom is the whole answer', JSON.parse(localStorage.getItem('bl.cfg')).me === 'Mom' && JSON.parse(localStorage.getItem('bl.cfg')).feed === 'breast');
    check('then the tips, once', !d.querySelector('#guide').open && d.querySelector('#welcomeSheet').open);
    d.querySelector('#welcomeMore').click();
    check('"Show me more" opens the full help', !d.querySelector('#welcomeSheet').open && d.querySelector('#helpSheet').open);
    check('help covers joining a shared log', d.querySelector('#helpSheet').textContent.includes('Invite another phone') && d.querySelector('#helpSheet').textContent.includes('walks you through'));
    d.querySelector('#helpInstall').click();
    check('help can jump to the Home Screen steps', !d.querySelector('#helpSheet').open && d.querySelector('#install').open);
    d.querySelector('#helpBtn').click();
    check('the ? button brings the short tips back any time', d.querySelector('#welcomeSheet').open && !d.querySelector('#helpSheet').open);
    d.querySelector('#welcomeMore').click();
    check('the full help is one tap from the short tips', d.querySelector('#helpSheet').open && !d.querySelector('#welcomeSheet').open);
    d.querySelector('#helpBasics').click();
    check('the full help has a way back to the short tips', d.querySelector('#welcomeSheet').open && !d.querySelector('#helpSheet').open);
    d.querySelector('#welcomeOk').click();
    check('"Got it" closes the short tips', !d.querySelector('#welcomeSheet').open);
    d.querySelector('.act[data-log="poop"]').click();
    d.querySelector('#traySave').click();
    d.querySelector('.act[data-log="feed"]').click();
    d.querySelector('#traySave').click();
    d.querySelector('.act[data-log="pee"]').click(); // tapped and never answered: the tray is still open when the app is closed
    check('an unanswered tap is not in the log', Object.keys(JSON.parse(localStorage.getItem('bl.events'))).length === 2);
    await load('../index.html?reopen');
    d = frame.contentDocument;
    check('entries are still there after reopening', d.querySelectorAll('.row').length === 2, `rows=${d.querySelectorAll('.row').length}`);
    check('the unanswered tap is waiting after reopening, still not logged', d.querySelectorAll('.waiting').length === 1 && d.querySelector('.waiting-text strong').textContent.startsWith('Save this pee from ') && Object.keys(JSON.parse(localStorage.getItem('bl.events'))).length === 2 && d.querySelector('#tray').hidden);
    d.querySelector('.waiting [data-waiting="discard"]').click();
    check('discarding it leaves nothing behind', JSON.parse(localStorage.getItem('bl.drafts')).length === 0 && d.querySelectorAll('.row').length === 2);
    check('welcome is not shown twice', !d.querySelector('#welcomeSheet').open);
    check('each entry has its little drawing', d.querySelectorAll('.row .row-ico use').length === 2);
    await load('../index.html?show=nudge');
    d = frame.contentDocument;
    check('the Home Screen nudge can show and be dismissed', !d.querySelector('#nudge').hidden && (d.querySelector('#nudgeHide').click(), d.querySelector('#nudge').hidden));
    await load('../index.html?reopen');
    d = frame.contentDocument;
    check('sharing is off until a key is added', d.querySelector('#syncText').textContent === 'This phone only. Tap to connect');
    d.querySelector('#syncBtn').click();
    check('tapping those words brings the Connect screen back', d.querySelector('#guide').open && !d.querySelector('.guide-step[data-step="connect"]').hidden);
    d.querySelector('.guide-step[data-step="connect"] [data-guide="skip-connect"]').click();
    check('and it can be left again', !d.querySelector('#guide').open);

    // ── setup link from the other phone ──
    const core = await import('../core.js');
    await load(`../index.html?link#s=${core.encodeSetup({ t: 'test-key', r: 'someone/somewhere', b: 'Test Baby' })}`);
    d = frame.contentDocument;
    const cfg = JSON.parse(localStorage.getItem('bl.cfg') || '{}');
    check('a setup link turns sharing on', cfg.token === 'test-key' && cfg.repo === 'someone/somewhere');
    check('the baby name comes with it', d.querySelector('#babyName').textContent === 'Test Baby');
    check('the key is removed from the address bar', !frame.contentWindow.location.hash);
    frame.contentDocument.querySelector('#gearBtn').click();
    d.querySelector('#setToken').value = `https://x.test/babylog/#s=${core.encodeSetup({ t: 'pasted-key', r: 'other/place', b: '' })}`;
    d.querySelector('#settingsForm').requestSubmit();
    const cfg2 = JSON.parse(localStorage.getItem('bl.cfg') || '{}');
    check('a setup link pasted into Settings works too', cfg2.token === 'pasted-key' && cfg2.repo === 'other/place', JSON.stringify(cfg2));
    check('the two entries are queued to share', Object.keys(JSON.parse(localStorage.getItem('bl.dirty') || '{}')).length >= 1);

    // ── pump, how much, how long (sample data) ──
    await load('../index.html?demo&pump');
    d = frame.contentDocument;
    const qq = (s) => d.querySelector(s);
    check('five one-tap buttons, Meds last', d.querySelectorAll('.act').length === 5 && qq('.act[data-log="pump"] .act-label').textContent === 'Pump' && qq('.act:last-child .act-label').textContent === 'Meds');
    check('four "last" tiles', d.querySelectorAll('.since-item').length === 4 && qq('#sincePumpSub').textContent === 'None yet');
    qq('.act[data-log="pump"]').click();
    check('a pump asks how much, not which side', !qq('#trayAmount').hidden && qq('#traySide').hidden && qq('#trayAmountLabel').textContent === 'How much did you get');
    qq('#trayAmount .chip[data-oz="3"]').click();
    check('one tap sets the ounces', qq('#trayWhat').textContent === '3 oz' && qq('#trayOz').textContent === '3 oz');
    qq('#trayAmount .chip[data-step="0.5"]').click();
    check('+ half nudges it', qq('#trayWhat').textContent === '3.5 oz');
    qq('#trayAmount .chip[data-step="-0.5"]').click();
    qq('#trayAmount .chip[data-oz="3"]').click();
    check('tapping the same amount again clears it', qq('#trayWhat').textContent === '' && qq('#trayOz').textContent === 'Not set', qq('#trayOz').textContent);
    check('no pump is running until it is saved', qq('#running').hidden || qq('#runningWhat').textContent !== 'Pumping'); // an earlier feed in this check may still be going
    qq('#traySave').click();
    check('a pump just saved shows as going, with one Done button', !qq('#running').hidden && qq('#runningWhat').textContent === 'Pumping' && qq('#runningDone').textContent === 'Done pumping');
    qq('#runningDone').click();
    check('Done saves how long it took', d.querySelector('.row .row-detail')?.textContent === '1 min' && qq('#running').hidden, d.querySelector('.row .row-detail')?.textContent);
    check('the count line names pumps once there is one', qq('#tally').textContent.endsWith('1 pump'));
    qq('.act[data-log="feed"]').click();
    check('a feed asks the side first, and how much only for a bottle', !qq('#traySide').hidden && qq('#trayAmount').hidden);
    qq('#traySide .chip[data-side="bottle"]').click();
    check('Bottle brings up how much', !qq('#trayAmount').hidden && qq('#trayAmountLabel').textContent === 'How much did she drink');
    qq('#trayAmount .chip[data-oz="2"]').click();
    const feedRow = () => [...d.querySelectorAll('.row')].find((r) => r.querySelector('.row-kind').textContent === 'Feed'); // the feed and the pump can share a millisecond here
    check('bottle and ounces read together', qq('#trayWhat').textContent === 'Bottle · 2 oz', qq('#trayWhat').textContent);
    qq('#traySide .chip[data-side="L"]').click();
    check('switching to a breast drops the ounces', qq('#trayWhat').textContent === 'Started left' && qq('#trayAmount').hidden, qq('#trayWhat').textContent);
    qq('#traySave').click();
    feedRow().click();
    d.querySelector('input[name="kind"][value="pump"]').click();
    check('editing a pump hides the side, keeps minutes and ounces', qq('#editSide').hidden && !qq('#feedFields').hidden);
    qq('#editCancel').click();

    // ── how much, in mL (fresh sample data, so the new pump is the top row) ──
    await load('../index.html?demo&ml0');
    d = frame.contentDocument;
    qq('.act[data-log="pump"]').click();
    check('ounces until someone picks mL', !qq('#trayAmount [data-for-unit="oz"]').hidden && qq('#trayAmount [data-for-unit="ml"]').hidden && qq('#trayAmount .chip[data-unit="oz"]').getAttribute('aria-pressed') === 'true');
    qq('#trayAmount .chip[data-oz="2"]').click();
    qq('#trayAmount .chip[data-unit="ml"]').click();
    check('tapping mL swaps in the mL buttons', qq('#trayAmount [data-for-unit="oz"]').hidden && !qq('#trayAmount [data-for-unit="ml"]').hidden && qq('#trayAmount .chip[data-unit="ml"]').getAttribute('aria-pressed') === 'true');
    check('and leaves the amount already entered alone', qq('#trayWhat').textContent === '2 oz' && qq('#trayMl').textContent === '2 oz', qq('#trayWhat').textContent);
    qq('#trayAmount .chip[data-ml="45"]').click();
    check('one tap sets the mL', qq('#trayWhat').textContent === '45 mL' && qq('#trayMl').textContent === '45 mL' && qq('#trayAmount .chip[data-ml="45"]').getAttribute('aria-pressed') === 'true', qq('#trayWhat').textContent);
    qq('#trayAmount .chip[data-step-ml="1"]').click();
    qq('#trayAmount .chip[data-step-ml="1"]').click();
    qq('#trayAmount .chip[data-step-ml="-5"]').click();
    check('+1 and -5 nudge it to the exact mL', qq('#trayWhat').textContent === '42 mL', qq('#trayWhat').textContent);
    qq('#trayAmount .chip[data-ml="45"]').click();
    qq('#trayAmount .chip[data-ml="45"]').click();
    check('tapping the same mL again clears it', qq('#trayWhat').textContent === '' && qq('#trayMl').textContent === 'Not set');
    qq('#trayAmount .chip[data-ml="30"]').click();
    qq('#trayAmount .chip[data-step-ml="1"]').click();
    qq('#traySave').click();
    check('saved, the exact mL is on the entry and the Last pump tile', d.querySelector('.row .row-detail')?.textContent === '31 mL' && qq('#sincePumpSub').textContent.endsWith('31 mL'), d.querySelector('.row .row-detail')?.textContent);
    d.querySelector('.row').click();
    check('editing opens in mL with the exact number', qq('#editSheet').open && qq('#editAmount').value === '31' && qq('#editForm').elements.unit.value === 'ml' && qq('#editAmount').step === '1');
    qq('#editAmount').value = '37';
    qq('#editSave').click();
    check('a typed mL amount is saved as typed', d.querySelector('.row .row-detail')?.textContent.startsWith('37 mL'), d.querySelector('.row .row-detail')?.textContent);
    d.querySelector('.row').click();
    d.querySelector('input[name="unit"][value="oz"]').click();
    qq('#editAmount').value = '1.25';
    qq('#editSave').click();
    check('the same entry can be put back in ounces', d.querySelector('.row .row-detail')?.textContent.startsWith('1.25 oz'), d.querySelector('.row .row-detail')?.textContent);
    d.querySelector('.row').click();
    qq('#editAmount').value = '';
    qq('#editSave').click();
    check('emptying the box clears the amount', !(d.querySelector('.row .row-detail')?.textContent || '').match(/oz|mL/), d.querySelector('.row .row-detail')?.textContent);

    // ── donor milk, and what she drank ──
    await load('../index.html?demo&donor');
    d = frame.contentDocument;
    check('the sample bottle is added up on the front page, in ounces', !qq('#intakeLine').hidden && qq('#intake').textContent === '2 oz from 1 bottle', qq('#intake').textContent);
    qq('.act[data-log="pump"]').click();
    check('a pump is not asked about donor milk', qq('#trayMilk').hidden);
    qq('#trayDiscard').click();
    qq('.act[data-log="feed"]').click();
    qq('#traySide .chip[data-side="bottle"]').click();
    check('a bottle feed offers Donor milk', !qq('#trayMilk').hidden && qq('#trayDonor').getAttribute('aria-pressed') === 'false');
    check('an unsaved bottle is not in the total', qq('#intake').textContent === '2 oz from 1 bottle', qq('#intake').textContent);
    qq('#traySave').click();
    check('a saved bottle with no amount is called out', qq('#intake').textContent === '2 oz from 1 bottle · 1 bottle with no amount', qq('#intake').textContent);
    qq('#toastAction').click();
    qq('.act[data-log="feed"]').click();
    qq('#traySide .chip[data-side="bottle"]').click();
    qq('#trayAmount .chip[data-unit="ml"]').click();
    qq('#trayAmount .chip[data-ml="30"]').click();
    qq('#trayDonor').click();
    const topFeed = () => [...d.querySelectorAll('.row')].find((r) => r.querySelector('.row-kind').textContent === 'Feed');
    check('one tap marks it donor milk', qq('#trayDonor').getAttribute('aria-pressed') === 'true' && qq('#trayWhat').textContent === 'Bottle · Donor milk · 30 mL', qq('#trayWhat').textContent);
    qq('#trayDonor').click();
    check('tapping it again takes the mark off', qq('#trayWhat').textContent === 'Bottle · 30 mL');
    qq('#trayDonor').click();
    qq('#traySave').click();
    check('saved, the entry says donor milk', topFeed().querySelector('.row-detail').textContent === 'Bottle · Donor milk · 30 mL', topFeed().textContent);
    check('the front page total follows, in mL once mL is picked', qq('#intake').textContent === '89 mL from 2 bottles · 30 mL donor milk', qq('#intake').textContent);
    check('each day in the list has its own total', d.querySelector('.day .day-drank')?.textContent.includes('donor milk'), d.querySelector('.day .day-drank')?.textContent);
    topFeed().click();
    check('editing shows the donor mark', qq('#editSheet').open && !qq('#editMilk').hidden && qq('#editForm').elements.donor.checked);
    d.querySelector('#editForm input[name="side"][value="L"]').click();
    check('a breast feed has no donor box', qq('#editMilk').hidden);
    qq('#editSave').click();
    check('moved to a breast, the mark and the amount leave the total', topFeed().querySelector('.row-detail').textContent.startsWith('Started left') && !topFeed().textContent.includes('Donor') && qq('#intake').textContent === '59 mL from 1 bottle', `${topFeed().textContent} | ${qq('#intake').textContent}`);

    // ── mL is remembered on this phone, and saved exactly ──
    localStorage.clear();
    await load('../index.html?ml');
    d = frame.contentDocument;
    d.querySelector('#guide [data-who="dad"]').click();
    d.querySelector('#welcomeOk').click();
    d.querySelector('.act[data-log="pump"]').click();
    d.querySelector('#trayAmount .chip[data-unit="ml"]').click();
    d.querySelector('#trayAmount .chip[data-ml="60"]').click();
    d.querySelector('#trayAmount .chip[data-step-ml="-1"]').click();
    check('the amount is held on the phone, not in the log, until Save', !localStorage.getItem('bl.events') || Object.keys(JSON.parse(localStorage.getItem('bl.events'))).length === 0);
    d.querySelector('#traySave').click();
    const savedMl = Object.values(JSON.parse(localStorage.getItem('bl.events')))[0];
    check('the entry is stored in mL, with ounces beside it only for an older copy of the app', savedMl.ml === 59 && savedMl.oz === 2, JSON.stringify(savedMl));
    check('this phone remembers mL', JSON.parse(localStorage.getItem('bl.cfg')).unit === 'ml' && JSON.parse(localStorage.getItem('bl.cfg')).me === 'Dad');
    await load('../index.html?ml2');
    d = frame.contentDocument;
    check('the mL entry reads the same after reopening', d.querySelector('.row .row-detail')?.textContent === '59 mL', d.querySelector('.row .row-detail')?.textContent);
    d.querySelector('.act[data-log="pump"]').click();
    check('the next one starts in mL', !d.querySelector('#trayAmount [data-for-unit="ml"]').hidden && d.querySelector('#trayAmount [data-for-unit="oz"]').hidden);

    // ── the invite, as an iPhone in Safari: put it on the Home Screen ──
    localStorage.clear();
    const code = core.encodeSetup({ t: 'invite-key', r: 'fam/log', b: 'Jubilee' });
    await load(`../index.html?as=safari#s=${code}`);
    d = frame.contentDocument;
    const step = (name) => !d.querySelector(`.guide-step[data-step="${name}"]`).hidden;
    check('an invite opened in Safari says hello first', d.querySelector('#guide').open && step('hello'));
    check('the invite is kept in the address, so Add to Home Screen carries it', frame.contentWindow.location.hash === `#s=${code}`);
    check('and this phone is connected already', JSON.parse(localStorage.getItem('bl.cfg')).token === 'invite-key');

    check('"Not now" moves on to whose phone', step('who'));

    d.querySelector('#nudgeShow').click();
    check('the reminder reopens the pictured steps', d.querySelector('#guide').open && step('install'));

    // ── the Home Screen app: the address carried the invite ──
    localStorage.clear();
    await load(`../index.html?as=home#s=${code}`);
    d = frame.contentDocument;
    check('opens connected, key gone from the address', JSON.parse(localStorage.getItem('bl.cfg')).token === 'invite-key' && !frame.contentWindow.location.hash);
    check('and goes straight to whose phone', d.querySelector('#guide').open && !d.querySelector('.guide-step[data-step="who"]').hidden);
    check('the baby name came with the invite', d.querySelector('#babyName').textContent === 'Jubilee');
    d.querySelector('#guide [data-who="dad"]').click();
    d.querySelector('#welcomeOk').click();
    d.querySelector('.act[data-log="feed"]').click();

    d.querySelector('#traySave').click();
    check('the entry carries his name', d.querySelector('.row .row-by').textContent === 'Dad');
    check('the invite card offers to share with Mom', !d.querySelector('#invite').hidden && d.querySelector('#inviteTitle').textContent === 'Share Jubilee with Mom');
    d.querySelector('#gearBtn').click();
    check('Settings shows Dad and Bottle picked, the key folded away', d.querySelector('input[name="who"][value="dad"]').checked && d.querySelector('input[name="feedkind"][value="bottle"]').checked && !d.querySelector('#setAdv').open && !d.querySelector('#setShare').hidden);
    d.querySelector('input[name="who"][value="mom"]').click();

    await load(`../index.html?as=home&again#s=${code}`);

    check('and the entry is still there', d.querySelectorAll('.row').length === 1);

    // ── the Home Screen app when the address did not carry it: one Connect button ──

    await load('../index.html?as=home&bare');
    d = frame.contentDocument;

    d.querySelector('#guidePasteGo').click();

    check('the Connect screen says what to paste, in three steps', d.querySelectorAll('.guide-step[data-step="connect"] .guide-list li').length === 3 && d.querySelector('.guide-step[data-step="connect"]').textContent.includes('very first phone'));

    d.querySelector('#guidePasteGo').click();
    check('the whole text message pasted in connects it', JSON.parse(localStorage.getItem('bl.cfg')).token === 'invite-key' && !d.querySelector('.guide-step[data-step="who"]').hidden);
    d.querySelector('#guideWhoOther').click();
    d.querySelector('#guideName').value = 'Grandma';

    check('someone else can type a name', JSON.parse(localStorage.getItem('bl.cfg')).me === 'Grandma' && !d.querySelector('#guide').open);

    d.querySelector('.guide-step[data-step="connect"] [data-guide="skip-connect"]').click();
    check('Connect can be skipped', !d.querySelector('.guide-step[data-step="who"]').hidden);
    localStorage.clear();
    await load('../index.html?as=home&firstphone');
    d = frame.contentDocument;
    d.querySelector('#guidePaste').value = 'github_pat_11ABCDEFG0abcdefghijkl_mnopqrstuvwxyz0123456789';
    d.querySelector('#guidePasteGo').click();
    const first = JSON.parse(localStorage.getItem('bl.cfg') || '{}');
    check('the first phone can paste its bare key', first.token === 'github_pat_11ABCDEFG0abcdefghijkl_mnopqrstuvwxyz0123456789' && first.repo === 'JamRaid36/babylog-data', JSON.stringify(first));

    // ── Mom's meds: add one, take it, early warning, undo, delete, remove; kept across reopening ──
    localStorage.clear();
    localStorage.setItem('bl.cfg', JSON.stringify({ role: 'dad', me: 'Dad', feed: 'bottle' }));
    localStorage.setItem('bl.seenWelcome', 'true');
    await load('../index.html?meds');
    d = frame.contentDocument;
    const m = (s) => d.querySelector(s);
    check('meds: the empty card says what it is for and offers one button', m('.meds-empty')?.textContent.includes("Mom's medicine") && !!m('.meds-empty .btn'));
    m('.meds-empty .btn').click();
    check('meds: Add opens with the two usual names to tap', m('#medSheet').open && d.querySelectorAll('#medPresetRow [data-preset]').length === 2 && m('#medHistory').hidden);
    m('#medForm').requestSubmit();
    check('meds: no name is refused near the box', m('#medSheet').open && !m('#medNameError').hidden);
    m('#medPresetRow [data-preset]').click();
    check('meds: a tap fills the name', m('#medName').value.startsWith('Ibuprofen') && m('#medPresetRow [data-preset]').getAttribute('aria-pressed') === 'true');
    m('#medDose').value = '600 mg';
    m('#medForm').requestSubmit();
    check('meds: no schedule is refused with a reason', m('#medSheet').open && !m('#medEveryError').hidden);
    m('#medForm input[name="every"][value="6"]').checked = true;
    m('#medForm').requestSubmit();
    check('meds: it is added and the card says not taken yet', !m('#medSheet').open && d.querySelectorAll('.med').length === 1 && m('.med-head').textContent === 'Not taken yet' && m('.med-name').textContent.includes('600 mg'));

    m('#doseCancel').click();
    m('.med [data-med="took"]').click();

    m('#doseForm input[name="back"][value="30"]').checked = true;
    m('#doseForm input[name="back"][value="30"]').dispatchEvent(new Event('change', { bubbles: true }));
    m('#doseForm').requestSubmit();
    const doses = () => Object.values(JSON.parse(localStorage.getItem('bl.meds') || '{}')).filter((e) => e.k === 'dose' && !e.x);
    check('meds: Save logs one dose, 30 min back, by this phone', doses().length === 1 && Math.abs(Date.now() - 30 * 60e3 - doses()[0].t) < 90e3 && doses()[0].by === 'Dad');
    check('meds: the card now says when it is OK again, with words and a mark', m('.med-head').textContent.startsWith('OK again at ') && !!m('.med-head svg') && m('.med').dataset.ok === 'false', m('.med-head').textContent);
    check('meds: the toast says it, with Undo', m('#toastText').textContent.startsWith('Ibuprofen') && m('#toastText').textContent.includes('OK again') && m('#toastAction').textContent === 'Undo', m('#toastText').textContent);
    m('.med [data-med="took"]').click();
    check('meds: a second one too early is called out, and Save says anyway', !m('#doseWarn').hidden && m('#doseWarn').textContent.includes('Earlier than her schedule') && m('#doseSave').textContent === 'Save anyway');
    m('#doseCancel').click();
    check('meds: Cancel logs nothing', doses().length === 1 && !m('#doseSheet').open);
    m('.med [data-med="took"]').click();
    m('#doseWhen').value = core.toLocalInput(Date.now() + 3 * 3600e3);
    m('#doseWhen').dispatchEvent(new Event('change', { bubbles: true }));
    m('#doseForm').requestSubmit();
    check('meds: a time in the future is refused near the box', m('#doseSheet').open && !m('#doseWhenError').hidden && doses().length === 1);
    m('#doseCancel').click();
    await load('../index.html?meds-again');
    d = frame.contentDocument;
    check('meds: closing and reopening keeps her medicine and the dose', d.querySelectorAll('.med').length === 1 && d.querySelector('.med-head').textContent.startsWith('OK again at '));

    check('meds: the second tap deletes it, with Undo', doses().length === 0 && d.querySelector('#toastAction').textContent === 'Undo');
    d.querySelector('#toastAction').click();
    check('meds: Undo brings the dose back', doses().length === 1);
    d.querySelector('#medRemove').click();
    check('meds: removing asks for a second tap', d.querySelector('#medRemove').textContent === 'Tap again to remove it' && d.querySelectorAll('.med').length === 1);
    d.querySelector('#medRemove').click();
    check('meds: removed from the front page, her dose kept', !!d.querySelector('.meds-empty') && doses().length === 1);
    d.querySelector('#toastAction').click();
    check('meds: Undo puts the medicine back', d.querySelectorAll('.med').length === 1);
    check('meds: nothing of hers went into the baby log', Object.keys(JSON.parse(localStorage.getItem('bl.events') || '{}')).length === 0);
    localStorage.clear();
    await load('../index.html?demo=dose-early');
    d = frame.contentDocument;
    check('meds: sample data shows three medicines, one OK now', d.querySelectorAll('.med').length === 3 && [...d.querySelectorAll('.med')].some((x) => x.dataset.ok === 'true'));
    d.querySelector('#doseCancel').click();
    d.querySelector('.act[data-log="meds"]').click();
    check('meds: with several, the Meds button asks which, with each status', d.querySelector('#medPickSheet').open && d.querySelectorAll('#medPickList [data-pick]').length === 3 && d.querySelector('#medPickList .pick-status').textContent.length > 0);
    d.querySelectorAll('#medPickList [data-pick]')[1].click();
    check('meds: picking one opens its Took it sheet', !d.querySelector('#medPickSheet').open && d.querySelector('#doseSheet').open && d.querySelector('#doseTitle').textContent === 'Tylenol');
    d.querySelector('#doseForm').requestSubmit();
    check('meds: saving from there flashes the Meds button', d.querySelector('.act[data-log="meds"]').classList.contains('is-logged') && d.querySelector('.act[data-log="meds"] .act-label').textContent === 'Saved');

    // ── History folds: today in full, the last two weeks one line each, older behind a button ──
    localStorage.clear();
    localStorage.setItem('bl.cfg', JSON.stringify({ role: 'dad', me: 'Dad', feed: 'bottle' }));
    localStorage.setItem('bl.seenWelcome', 'true');
    const mk = (daysBack, k) => { const t = Date.now() - daysBack * 864e5 - k.length * 60e3; const id = `${new Date(t).toISOString().slice(0, 10)}-${t.toString(36)}${k}`; return [id, { id, k, t, u: t }]; };
    localStorage.setItem('bl.events', JSON.stringify(Object.fromEntries([mk(0, 'pee'), mk(3, 'feed'), mk(3, 'poop'), mk(20, 'pee')])));
    await load('../index.html?folds');
    d = frame.contentDocument;
    const f = (s) => d.querySelector(s);
    check('folds: only today is drawn as rows', d.querySelectorAll('#log .row').length === 1);
    check('folds: the last two weeks are one line each, the older day hidden behind a button', d.querySelectorAll('.fold').length === 1 && f('#foldMore')?.textContent === 'Show older days (1)' && f('.fold-count').textContent.startsWith('1 feed'));
    f('#foldMore').click();
    check('folds: "Show older days" shows it, and can be undone', d.querySelectorAll('.fold').length === 2 && f('#foldMore').textContent === 'Show only the last two weeks');
    f('#foldMore').click();
    f('.fold').click();
    check('folds: tapping a day opens it in a sheet with its entries', f('#daySheet').open && d.querySelectorAll('#dayRows .row').length === 2 && f('#dayCount').textContent.startsWith('1 feed'));
    f('#dayRows .row').click();
    check('folds: an entry there opens the usual edit sheet', f('#editSheet').open);
    f('#editDelete').click();
    f('#editDelete').click();
    check('folds: deleting it updates the open day', f('#daySheet').open && d.querySelectorAll('#dayRows .row').length === 1 && f('#dayCount').textContent.startsWith('0 feeds'));
    f('#toastAction').click();
    check('folds: Undo puts it back in the open day', d.querySelectorAll('#dayRows .row').length === 2);
    f('#dayClose').click();
    check('folds: Done closes the day; nothing was lost', !f('#daySheet').open && Object.keys(JSON.parse(localStorage.getItem('bl.events'))).length === 4);
  } catch (err) {
    check('the check itself ran', false, String(err && err.stack || err));
  } finally {
    frame.src = 'about:blank';
    localStorage.clear();
    document.getElementById('out').textContent = `${lines.join('\n')}\n${failed ? `FAILED ${failed}` : `ALL ${lines.length} PASSED`}`;
  }
})();
