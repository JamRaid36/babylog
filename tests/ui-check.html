<!doctype html>
<meta charset="utf-8">
<title>Baby log: tap-through check</title>
<!-- Drives the real app in a frame and prints PASS/FAIL lines. Serve the repo folder, then:
     chrome --headless=new --virtual-time-budget=20000 --dump-dom http://127.0.0.1:8765/tests/ui-check.html
     Uses the test origin's own storage only; it clears it before and after. -->
<pre id="out">RUNNING</pre>
<iframe id="app" style="width:390px;height:844px;border:1px solid #999"></iframe>
<script>
const lines = [];
let failed = 0;
const check = (name, ok, extra = '') => { if (!ok) failed += 1; lines.push(`${ok ? 'PASS' : 'FAIL'} ${name}${extra ? ` (${extra})` : ''}`); };
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const frame = document.getElementById('app');
const load = (url) => new Promise((r) => { frame.onload = () => setTimeout(r, 300); frame.src = url; });

(async () => {
  try {
    localStorage.clear();

    // ── with sample data ──
    await load('../index.html?demo');
    let d = frame.contentDocument;
    const q = (s) => d.querySelector(s);
    const rows = () => d.querySelectorAll('.row').length;
    const before = rows();
    check('sample entries are listed', before === 13, `rows=${before}`);

    q('.act[data-log="pee"]').click();
    check('one tap on Pee adds an entry', rows() === before + 1);
    check('tray opens and names it', !q('#tray').hidden && q('#trayTitle').textContent.startsWith('Pee saved'));
    check('side choices stay hidden for a pee', q('#traySide').hidden);
    check('"last pee" shows just now', q('#sincePee').textContent === 'just now');
    check('the button confirms', q('.act[data-log="pee"] .act-label').textContent === 'Logged');

    q('#trayWhen .chip[data-back="15"]').click();
    check('"15 min" moves the entry back', q('#sincePee').textContent === '15m', q('#sincePee').textContent);
    check('still one entry, not two', rows() === before + 1);

    q('#trayUndo').click();
    check('Undo removes it', rows() === before && q('#tray').hidden);
    check('Undo says so', q('#toastText').textContent === 'Pee removed.');

    q('.act[data-log="feed"]').click();
    check('side choices show for a feed', !q('#traySide').hidden);
    q('#traySide .chip[data-side="L"]').click();
    check('one tap sets the side', d.querySelector('.row .row-detail')?.textContent === 'Left');
    check('"last feed" shows the side', q('#sinceFeedSub').textContent.endsWith('Left'));
    q('#trayDone').click();
    check('Done closes the tray', q('#tray').hidden);

    d.querySelector('.row').click();
    check('tapping an entry opens the editor', q('#editSheet').open);
    check('editor shows the saved side', d.querySelector('input[name="side"][value="L"]').checked);
    q('#editNote').value = 'sleepy <b>feed</b>';
    q('#editMin').value = '12';
    q('#editForm').requestSubmit();
    const det = d.querySelector('.row .row-detail');
    check('note and minutes are saved', det.textContent === 'Left · 12 min · sleepy <b>feed</b>', det.textContent);
    check('a note cannot inject markup', det.querySelector('b') === null);
    check('editor closes after saving', !q('#editSheet').open);

    d.querySelector('.row').click();
    d.querySelector('input[name="kind"][value="poop"]').click();
    check('feed-only fields hide for a poop', q('#feedFields').hidden);
    q('#editCancel').click();
    check('Cancel changes nothing', d.querySelector('.row .row-kind').textContent === 'Feed');

    d.querySelector('.row').click();
    q('#editDelete').click();
    check('first Delete tap only arms it', rows() === before + 1 && q('#editDelete').textContent === 'Tap again to delete it');
    q('#editDelete').click();
    check('second tap deletes', rows() === before);
    check('delete offers Undo', !q('#toastAction').hidden && q('#toastAction').textContent === 'Undo');
    q('#toastAction').click();
    check('Undo brings it back', rows() === before + 1);

    q('#gearBtn').click();
    check('settings open', q('#settingsSheet').open);
    q('#setRepo').value = 'not a repo';
    q('#settingsForm').requestSubmit();
    check('a bad log location is refused with a reason', q('#settingsSheet').open && !q('#setTokenError').hidden);
    q('#setRepo').value = 'JamRaid36/babylog-data';
    q('#setToken').value = 'https://example.test/app/#s=!!!';
    q('#settingsForm').requestSubmit();
    check('an unreadable setup link is refused with a reason', q('#settingsSheet').open && q('#setTokenError').textContent.includes('fresh one'));
    q('#setCancel').click();

    // ── real mode: does a tap survive closing the app? ──
    await load('../index.html');
    d = frame.contentDocument;
    check('first open is empty with a hint', d.querySelector('.empty-title')?.textContent === 'Nothing logged yet');
    d.querySelector('.act[data-log="poop"]').click();
    d.querySelector('.act[data-log="feed"]').click();
    await load('../index.html?reopen');
    d = frame.contentDocument;
    check('entries are still there after reopening', d.querySelectorAll('.row').length === 2, `rows=${d.querySelectorAll('.row').length}`);
    check('sharing is off until a key is added', d.querySelector('#syncText').textContent === 'This phone only');

    // ── setup link from the other phone ──
    const core = await import('../core.js');
    await load(`../index.html?link#s=${core.encodeSetup({ t: 'test-key', r: 'someone/somewhere', b: 'Test Baby' })}`);
    d = frame.contentDocument;
    const cfg = JSON.parse(localStorage.getItem('bl.cfg') || '{}');
    check('a setup link turns sharing on', cfg.token === 'test-key' && cfg.repo === 'someone/somewhere');
    check('the baby name comes with it', d.querySelector('#babyName').textContent === 'Test Baby');
    check('the key is removed from the address bar', !frame.contentWindow.location.hash);
    frame.contentDocument.querySelector('#gearBtn').click();
    d.querySelector('#setToken').value = `https://x.test/babylog/#s=${core.encodeSetup({ t: 'pasted-key', r: 'other/place', b: '' })}`;
    d.querySelector('#settingsForm').requestSubmit();
    const cfg2 = JSON.parse(localStorage.getItem('bl.cfg') || '{}');
    check('a setup link pasted into Settings works too', cfg2.token === 'pasted-key' && cfg2.repo === 'other/place', JSON.stringify(cfg2));
    check('the two entries are queued to share', Object.keys(JSON.parse(localStorage.getItem('bl.dirty') || '{}')).length >= 1);
  } catch (err) {
    check('the check itself ran', false, String(err && err.stack || err));
  } finally {
    frame.src = 'about:blank';
    localStorage.clear();
    document.getElementById('out').textContent = `${lines.join('\n')}\n${failed ? `FAILED ${failed}` : `ALL ${lines.length} PASSED`}`;
  }
})();
</script>
